name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: pyproject.toml declares `requires-python = ">=3.9"`, but
        # the pinned numpy==2.4.4 in requirements.txt has no distribution
        # for Python 3.9 or 3.10 (only 3.11+). This matrix reflects what
        # actually installs today, not the (currently inaccurate) floor
        # declared in pyproject.toml -- see that mismatch called out in
        # the project's README/issue tracker rather than silently
        # "fixed" here.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v --junitxml=pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: pytest-results.xml
