[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sytogen"
version = "0.1.0"
description = "SyToGen web application and command-line tools"
requires-python = ">=3.9"
dependencies = [
    "biopython==1.88",
    "pandas==3.0.2",
    "numpy==2.4.4",
]

[project.optional-dependencies]
web = [
    "Flask==3.1.2",
    "blinker==1.9.0",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "Werkzeug==3.1.4",
    "plotly==6.9.0",
]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
sytogen = "sytogen.cli:main"

[tool.setuptools.packages.find]
include = ["sytogen*"]